[pytest]
addopts = -p no:libtmux
testpaths = tests
pythonpath = .
filterwarnings =
    # starlette 1.10 TestClient пока использует httpx; миграция на httpx2 меняет
    # поведение cookie в TestClient (ломает test_pdf_missing_scan_404) — отложена.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
