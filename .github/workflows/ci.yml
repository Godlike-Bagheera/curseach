name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff — критические ошибки)
        run: ruff check .

      - name: Type check (mypy, пока не блокирует)
        continue-on-error: true
        run: mypy checks scanner database.py main.py

      - name: Run tests + coverage
        run: pytest -q --cov=checks --cov=scanner --cov-report=term-missing --cov-report=xml

      - name: Smoke — import app
        run: python -c "import web_app; print('app OK')"
